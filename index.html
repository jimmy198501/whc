<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韋宏小C招募特攻隊｜十二週行動節奏挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eedfbc; --cream:#fff9e8; --navy:#15286a; --navy-d:#0d1a48;
  --red:#c8102e; --ink:#1d1a16; --mut:#6a604c; --line:rgba(21,40,106,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(ellipse at center,transparent 55%,rgba(110,80,20,.26) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--red);outline-offset:2px}

/* ---------- 海報頭 ---------- */
.starband{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.7em;padding:6px 0 6px .7em;white-space:nowrap;overflow:hidden;text-align:center}
.stripes{height:14px;border-top:3px solid var(--navy);border-bottom:3px solid var(--navy);background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--cream) 22px 44px)}
.hero{text-align:center;padding:16px 0 20px}
.ribbon{display:inline-block;background:var(--navy);color:#fff;font-weight:900;font-size:16px;letter-spacing:.18em;padding:5px 16px 5px 18px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--red)}
.iw{margin:8px 0 0;font-family:Anton,Impact,"Noto Sans TC",sans-serif;font-weight:400;font-size:clamp(68px,24vw,128px);line-height:.98;color:var(--navy);text-shadow:4px 4px 0 rgba(29,26,22,.14)}
.iw .you{color:var(--red)}
.tagline{margin:10px 0 0;font-weight:900;font-size:clamp(20px,6vw,27px);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips span{border:2px solid var(--navy);background:var(--cream);padding:3px 11px;font-weight:700;font-size:13px;border-radius:999px}
.hero.compact{padding:12px 0 14px}
.hero.compact .iw{font-size:clamp(48px,16vw,76px)}
.hero.compact .tagline{font-size:clamp(16px,4.6vw,20px)}

/* ---------- 版面 ---------- */
section{margin-top:18px}
.card{background:var(--cream);border:3px solid var(--navy);border-radius:6px;box-shadow:5px 5px 0 var(--navy);padding:16px 14px}
.tag{display:inline-block;background:var(--navy);color:#fff;font-weight:900;font-size:15px;letter-spacing:.06em;padding:3px 12px;transform:rotate(-1deg);margin-bottom:10px}
.tag.red{background:var(--red)}
.note{margin:8px 0 0;font-size:13px;color:var(--mut);line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{margin:0 0 4px;font-size:20px;font-weight:900;color:var(--navy)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:3px solid var(--navy);border-radius:4px;box-shadow:3px 3px 0 var(--navy);font-weight:900;padding:9px 16px;font-size:16px;text-decoration:none;user-select:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
.btn.ghost{background:var(--cream);color:var(--navy)}
.btn.small{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- 選隊長 / 選自己 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:8px;background:var(--cream);color:var(--navy);border:3px solid var(--navy);border-radius:4px;box-shadow:3px 3px 0 var(--navy);font-size:19px;font-weight:900}
.pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
.pick small{font-size:12px;font-weight:700;color:var(--red)}
.pick.chief{grid-column:1/-1;background:var(--navy);color:#fff}
.pick.chief small{color:#ffd9de}
.list{display:grid;gap:10px}
.list .pick{flex-direction:row;justify-content:flex-start;padding:10px 14px}

/* ---------- 使用者列 ---------- */
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:6px;box-shadow:4px 4px 0 var(--red)}
.me b{font-size:20px}
.me small{display:block;font-size:13px;opacity:.85}
.me button{background:transparent;color:#fff;border:2px solid #fff;border-radius:4px;padding:4px 10px;font-weight:700;font-size:13px}
.banner{margin-top:12px;background:#fff3c4;border:2px dashed var(--navy);padding:8px 12px;font-size:13px;line-height:1.6}

/* ---------- 進度 ---------- */
.big{font-family:Anton,Impact,"Noto Sans TC",sans-serif;font-size:58px;line-height:1;color:var(--navy)}
.big small{font-family:"Noto Sans TC",sans-serif;font-size:18px;font-weight:900}
.bar{height:14px;background:#fff;border:3px solid var(--navy);margin-top:8px}
.bar i{display:block;height:100%;background:var(--red)}
.pass{background:var(--red);color:#fff;border:3px double #fff;outline:3px solid var(--red);font-weight:900;padding:2px 12px;transform:rotate(4deg);letter-spacing:.1em}
.stamps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.stamp{position:relative;min-width:0;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:3px solid var(--navy);border-radius:50%;color:var(--navy);font-weight:900;font-size:clamp(12px,4.2vw,18px);line-height:1;padding:0}
.stamp small{font-size:10px;margin-top:1px}
.stamp.done{background:var(--red);color:#fff}
.stamp.done b{position:absolute;top:-9px;right:-5px;font-size:15px;color:var(--navy);text-shadow:0 0 0 #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff}
.stamp.cur{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--red)}
.stamp.lock{opacity:.5;border-style:dashed}
.stamp.sel{background:var(--navy);color:#fff}
.stamp.sel.done{background:var(--red)}

/* ---------- 每週任務 ---------- */
.chip{display:inline-block;border:2px solid var(--navy);background:#fff;font-weight:900;font-size:12px;padding:1px 8px;border-radius:999px;color:var(--navy)}
.chip.red{background:var(--red);color:#fff}
.task{display:flex;gap:12px;padding:14px 0;border-top:2px dashed var(--line)}
.task:first-of-type{border-top:0}
.no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:18px}
.task.ok .no{background:var(--red)}
.task .body{flex:1;min-width:0}
.task h3{margin:0;font-size:17px;font-weight:900;color:var(--navy)}
.task p{margin:2px 0 8px;font-size:13px;color:var(--mut);line-height:1.5}
.task .state{flex:0 0 24px;font-size:22px;color:var(--red);text-align:right}
.stepper{display:flex;align-items:center;gap:10px}
.step{width:42px;height:42px;background:var(--cream);color:var(--navy);border:3px solid var(--navy);border-radius:4px;box-shadow:2px 2px 0 var(--navy);font-size:24px;font-weight:900;line-height:1;padding:0}
.step:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--navy)}
.step[disabled]{opacity:.4;pointer-events:none}
.val{min-width:76px;text-align:center;font-family:Anton,Impact,sans-serif;font-size:28px;color:var(--navy)}
.val small{font-family:"Noto Sans TC",sans-serif;font-size:14px;font-weight:700;color:var(--mut)}
.thumb{display:block;max-width:100%;max-height:170px;border:3px solid var(--navy);border-radius:4px;margin:0 0 8px;background:#fff}
.lockmsg{margin:12px 0 0;padding:10px 12px;background:#fff3c4;border:2px dashed var(--navy);font-size:14px;font-weight:700;color:var(--navy)}

.shots{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.shot{position:relative;width:78px;height:78px;margin:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block;border:3px solid var(--navy);border-radius:4px;background:#fff}
.shot .x{position:absolute;top:-9px;right:-9px;width:26px;height:26px;padding:0;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--navy);font-weight:900;font-size:16px;line-height:1}

.tabs{display:flex;gap:10px;margin:16px 0 0}
.tabs button{flex:1;padding:10px;background:var(--cream);color:var(--navy);border:3px solid var(--navy);border-radius:4px;box-shadow:3px 3px 0 var(--navy);font-weight:900;font-size:16px}
.tabs button.on{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stat{border:3px solid var(--navy);background:#fff;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:Anton,Impact,"Noto Sans TC",sans-serif;font-weight:400;font-size:30px;line-height:1.15;color:var(--red)}
.stat span{font-size:12px;font-weight:700;color:var(--mut)}
.sel,.inp{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:3px solid var(--navy);border-radius:4px;background:#fff;color:var(--ink)}
.lbl{display:block;margin:12px 0 4px;font-weight:900;color:var(--navy);font-size:14px}
.teams{display:grid;gap:14px;margin-top:18px}
.team{display:block;width:100%;text-align:left;background:var(--cream);border:3px solid var(--navy);border-radius:6px;box-shadow:4px 4px 0 var(--navy);padding:12px 14px}
.team:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}
.top{display:flex;align-items:center;gap:12px}
.top h3{margin:0;font-size:19px;font-weight:900;color:var(--navy)}
.top small{color:var(--mut);font-weight:700;font-size:13px}
.rank{font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--red);min-width:30px;line-height:1}
.pc{margin-left:auto;font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--navy);line-height:1}
.mrow{padding:12px 0;border-top:2px dashed var(--line)}
.mrow:first-child{border-top:0}
.mrow .h{display:flex;align-items:center;gap:8px}
.mrow .h b{font-size:18px;color:var(--navy)}
.mrow .h .r{margin-left:auto;font-weight:900;color:var(--red);font-size:20px}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:10px;border:2px solid var(--navy);background:#fff;border-radius:2px}
.dots i.on{background:var(--red)}
.adm-task{padding:8px 0;border-top:2px dashed var(--line)}
.adm-task:first-child{border-top:0}
.ashots{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ashot{margin:0;width:82px}
.ashot img{width:82px;height:82px;object-fit:cover;border:3px solid var(--navy);border-radius:4px;display:block;background:#fff}
.ashot .acts{display:flex;gap:4px;margin-top:4px}
.ashot .acts button{flex:1;padding:4px 0;font-size:12px;font-weight:900;border:2px solid var(--navy);background:var(--cream);color:var(--navy);border-radius:3px}
.ashot .acts button.d{background:var(--red);color:#fff}
code.out{display:block;word-break:break-all;background:#fff;border:2px dashed var(--navy);padding:8px;margin-top:10px;font-size:12px;user-select:all}

.vpanel{margin-top:12px;padding:12px;background:#fff;border:3px solid var(--navy);border-radius:4px}
.vweeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.vw{min-width:0;padding:7px 0;font-weight:900;font-size:clamp(12px,3.6vw,15px);border:2px solid var(--navy);background:var(--cream);color:var(--navy);border-radius:4px}
.vw.done{background:var(--red);color:#fff}
.vw.none{opacity:.45;border-style:dashed}
.vw.on{outline:3px solid var(--navy);outline-offset:1px;opacity:1}
.vshot{display:block}
.vshot img{width:82px;height:82px;object-fit:cover;border:3px solid var(--navy);border-radius:4px;display:block;background:#fff}

/* ---------- 獎勵 ---------- */
.rw{list-style:none;margin:0;padding:0}
.rw li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line);font-weight:700;color:var(--mut)}
.rw li:first-child{border-top:0}
.rw li b{font-family:"Noto Sans TC",sans-serif;font-size:18px;font-weight:900;white-space:nowrap}
.rw li.on{color:var(--ink)}
.rw li.on b{color:var(--red)}
details{margin-top:12px;border:3px solid var(--navy);border-radius:4px;background:#fff}
summary{cursor:pointer;padding:10px 12px;font-weight:900;color:var(--navy);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right}
details[open] summary::after{content:"－"}
details .in{padding:0 12px 12px;font-size:14px;line-height:1.7}
.tier{padding:8px 0;border-top:2px dashed var(--line)}
.tier:first-child{border-top:0}
.tier b{color:var(--red)}
.qa details{margin-top:10px}

/* ---------- 其他 ---------- */
.foot{margin:26px 0 0;text-align:center;font-weight:900;color:var(--navy);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--navy);color:#fff;font-weight:700;padding:10px 18px;border:3px solid #fff;border-radius:4px;box-shadow:3px 3px 0 var(--red);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
#busy{position:fixed;inset:0;background:rgba(238,223,188,.75);display:none;align-items:center;justify-content:center;z-index:30;font-weight:900;font-size:20px;color:var(--navy)}
#busy.on{display:flex}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy">處理中…</div>

<script>
(function(){
'use strict';

/* =====================================================================
   設定區（上線前只需要改這裡）
   DB_URL     ：Firebase Realtime Database 網址，例如
                https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app
                空白 = 示範模式（資料只存在這台裝置）
   UPLOAD_URL ：Google Apps Script 網頁應用程式網址（見 gas-upload.gs）
   ===================================================================== */
const CONFIG = {
  DB_URL: 'https://elite2-d3f46-default-rtdb.asia-southeast1.firebasedatabase.app',
  UPLOAD_URL: 'https://script.google.com/macros/s/AKfycbyNGEdya_dqG-u4cnP0x0zO1DOcxKHYCnlbi08r3D1PXOXJanfrKOVhaXVrcmDSwJU6/exec',
  ROOT: 'whc',                   // 和菁英班共用同一個 Firebase 專案，用不同的根目錄區分
  PROJECT: 'whc',                 // 傳給 Apps Script，決定照片存到 Drive 的哪個資料夾
  START: [2026, 10, 5],          // 第 1 週的星期一（台北時間）
  WEEKS: 12,
  PASS: 10,
  FEE: 0,                        // 沒有報名費
  REWARD: 500,                   // 達成工作量（10/12 週）獎金
  RECRUIT_REWARD: 1000,
  MUFO_REWARD: 10000,
  ALLOW_PAST_EDIT: true,         // true = 過去的週次可以補登；false = 只能填本週
  ADMIN_HASH: '575b6a37c98cff23201ad03cfb8babb918075a0b4120f57d3f4a6f69d08069be'                 // 後台密碼代碼：打開網址後面加 #admin，照畫面產生後貼在這裡
};

/* 參賽名單：單純人名，沒有隊長／隊伍分組 */
const NAMES = ['林幼幼','黃名志','陳雅芳','張朝森','許世澤','陳巧旂','邱秀珊','廖婕詠','葉詩恩','李彩菱','劉雨婕','李啓陽','莊遵湧'];
const DEMO_MEMBERS = ['範例隊員 1','範例隊員 2','範例隊員 3','範例隊員 4','範例隊員 5'];

/* need = 每項任務要上傳幾張才算完成 */
const TASKS = [
  {no:1, field:'goal',      tag:'目標本',   need:1, title:'寫週目標本',   desc:'每週初寫下本週的招募目標與行動計畫，拍照上傳。'},
  {no:2, field:'sent',      tag:'丟出',     need:10, verb:'丟出', unit:'則', doneWord:'已丟出', title:'丟出 10 則',   desc:'邀請對方做「消費人格心理測驗」、「消費問卷」或「市調」，每則上傳 1 張證明，共 10 張。'},
  {no:3, field:'pushed',    tag:'推進名單', need:5,  verb:'推進名單', unit:'位', doneWord:'已推進', title:'推進名單 5 位', desc:'每推進 1 位上傳 1 張證明，共 5 張。'},
  {no:4, field:'interview', tag:'面談',     need:1, title:'面談 1 位',     desc:'壽星面對面、強連結、心談、評估、QA 都可以計入，上傳證明照片。'}
];

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const isDemo = !CONFIG.DB_URL;
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* Firebase key 不能含 . # $ [ ] /，全部換成 _ */
const keyOf = name => String(name).replace(/[.#$\[\]\/\s]/g, '_');

const S = { screen:'me', name:null, key:null, sel:1,
            prog:{weeks:{}, recruitPhotos:[], mufo:null} };

/* ---------- 週次 ---------- */
const startUtc = () => Date.UTC(CONFIG.START[0], CONFIG.START[1]-1, CONFIG.START[2]) - 8*3600e3; // 台北 00:00
/* 測試用：網址加 ?week=3 可以模擬第 3 週。只在 10/5 開跑前（或示範模式）有效，開跑後自動失效 */
function weekParam(){
  const q = new URLSearchParams(location.search).get('week');
  if(q === null || q === '' || isNaN(+q)) return null;
  if(!isDemo && Date.now() >= startUtc()) return null;
  return Math.max(0, Math.min(CONFIG.WEEKS + 1, +q));
}
function curWeek(){
  const wp = weekParam();
  if(wp !== null) return wp;
  const d = Math.floor((Date.now() - startUtc()) / 86400e3);
  if(d < 0) return 0;
  return Math.min(CONFIG.WEEKS+1, Math.floor(d/7) + 1);
}
function weekRange(w){
  const a = new Date(Date.UTC(CONFIG.START[0], CONFIG.START[1]-1, CONFIG.START[2] + (w-1)*7));
  const b = new Date(Date.UTC(CONFIG.START[0], CONFIG.START[1]-1, CONFIG.START[2] + (w-1)*7 + 6));
  const f = d => (d.getUTCMonth()+1) + '/' + d.getUTCDate();
  return f(a) + ' – ' + f(b);
}
/* 示範模式不受 10/5 開跑日限制（除非網址加 ?week= 模擬）；正式上線後才依日期開放 */
const simulated = weekParam() !== null;
const gated = () => !isDemo || simulated;
const isOpen = () => !gated() || curWeek() >= 1;
function canEdit(w){
  if(w < 1 || w > CONFIG.WEEKS) return false;
  if(!gated()) return true;
  const c = curWeek();
  if(c < 1 || w > c) return false;
  return CONFIG.ALLOW_PAST_EDIT || w === c;
}
const wkIn = (prog, w) => (prog.weeks && prog.weeks[w]) || {};
const wkObj = w => wkIn(S.prog, w);
function toArr(v){
  if(Array.isArray(v)) return v.filter(x => x && x.url);
  if(v && typeof v === 'object') return v.url ? [v] : Object.values(v).filter(x => x && x.url);
  return [];
}
const photosOf = (x, field) => toArr(x[field]);
const recruitCount = () => toArr(S.prog.recruitPhotos).length;

const dbUrl = p => CONFIG.DB_URL.replace(/\/$/, '') + '/' + CONFIG.ROOT + '/' + p + '.json';
async function dbReq(method, path, body){
  const r = await fetch(dbUrl(path), {method, headers:{'Content-Type':'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
  if(!r.ok) throw new Error('DB ' + r.status);

}
function saveDemo(ctx){ if(!LS.set('whc_demo_' + ctx.key, ctx.prog)) throw new Error('本機空間不足'); }
function normProg(p){

async function syncSummary(ctx){ if(!isDemo) await dbReq('PUT', 'summary/' + ctx.key, summaryOf(ctx.prog, ctx.name)); }

const timers = {};

  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {

/* ---------- 照片 ---------- */
function compress(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張照片')); };
    img.src = url;
  });
}
async function uploadPhoto(dataUrl, meta){
  if(!CONFIG.UPLOAD_URL){
    if(!isDemo) throw new Error('尚未設定照片上傳網址');
    return {url:dataUrl, thumb:dataUrl};
  }
  const r = await fetch(CONFIG.UPLOAD_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({project:CONFIG.PROJECT, folder:meta.folder, filename:meta.filename, mimeType:'image/jpeg', data:dataUrl.split(',')[1]})
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || '上傳失敗');
  return {url:j.url, thumb:j.thumb || j.url};
}
async function handleUpload(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const kind = input.dataset.upload, field = input.dataset.field, w = S.sel;
  if((kind === 'task' && !canEdit(w)) || (kind !== 'task' && !isOpen())){ input.value = ''; return; }
  const small = isDemo && !CONFIG.UPLOAD_URL;
  busy(true);
  try{
    for(let i = 0; i < files.length; i++){
      $('busy').textContent = files.length > 1 ? '上傳中 ' + (i + 1) + ' / ' + files.length + '…' : '上傳中…';
      const dataUrl = await compress(files[i], small ? 720 : 1280, small ? .6 : .75);
      const task = TASKS.find(t => t.field === field);
      const tag = kind === 'task' ? 'W' + w + '_' + (task ? task.tag : field) : (kind === 'recruit' ? '招募' : 'MUFO');
      const up = await uploadPhoto(dataUrl, {folder: S.name, filename: tag + '_' + Date.now() + '_' + i + '.jpg'});
      const val = {url:up.url, thumb:up.thumb, at:Date.now()};
      if(kind === 'task'){
        const list = photosOf(wkObj(w), field).concat([val]);
        S.prog.weeks[w] = Object.assign({}, wkObj(w), {[field]: list});
        await persistWeek(memberCtx(), w, {[field]: list});
      }else if(kind === 'recruit'){
        S.prog.recruitPhotos = toArr(S.prog.recruitPhotos).concat([val]);
        await persistRecruits(memberCtx());
      }else{
        S.prog.mufo = val;
        await persistMufo(memberCtx());
      }
    }
    toast('上傳成功 ✓');
  }catch(err){
    console.error(err);
    toast(err && err.message ? '上傳失敗：' + err.message : '上傳失敗，請再試一次', true);
  }finally{
    input.value = '';
    $('busy').textContent = '處理中…';
    busy(false);
    paint();
  }
}

    const x = wkIn(p, w), has = TASKS.some(t => photosOf(x, t.field).length), done = weekDoneIn(p, w);
    btns += '<button class="vw' + (w === v.w ? ' on' : '') + (done ? ' done' : '') + (has ? '' : ' none') + '" data-act="vweek" data-v="' + w + '" aria-label="第 ' + w + ' 週' + (done ? '，已完成' : '') + '">' + w + '</button>';
  }
  const x = wkIn(p, v.w);
  const tasks = TASKS.map(t => {
    const list = photosOf(x, t.field);
    return '<div class="adm-task"><b>' + esc(t.title) + '</b>　' + list.length + ' / ' + t.need + ' 張' + viewShots(list) + '</div>';
  }).join('');
  const rc = toArr(p.recruitPhotos), mu = (p.mufo && p.mufo.url) ? [p.mufo] : [];
  return '<div class="vpanel"><div class="vweeks" role="group" aria-label="選擇週次">' + btns + '</div>' +
    '<p class="note" style="margin:8px 0 2px">第 ' + v.w + ' 週　' + weekRange(v.w) + '　（紅色 ＝ 該週已完成）</p>' + tasks +
    '<details><summary>招募證明（' + rc.length + ' 張）</summary><div class="in">' + viewShots(rc) + '</div></details>' +
    '<details><summary>MUFO 完成畫面（' + (mu.length ? '已上傳' : '未上傳') + '）</summary><div class="in">' + viewShots(mu) + '</div></details></div>';
}
async function seedDemoData(){
  if(isDemo) return;
  if(!confirm('要產生示範成績嗎？會把全部 ' + allNames().length + ' 位參賽者的隨機進度寫入「成績榜」，方便展示，之後可以一次清除。')) return;
  busy(true);
  try{
    const patch = {};
    allNames().forEach(n => {
      const r = Math.random();
      let cnt;
      if(r < 0.15) cnt = 0;
      else if(r < 0.7) cnt = 1 + Math.floor(Math.random() * 9);
      else cnt = 10 + Math.floor(Math.random() * 3);
      const done = Array.from({length: Math.min(cnt, CONFIG.WEEKS)}, (_, i) => i + 1);
      patch[keyOf(n)] = {name: n, done, n: done.length, demo: true, at: Date.now()};
    });
    await dbReq('PATCH', 'summary', patch);
    toast('示範成績已產生 ✓');
  }catch(e){ console.error(e); toast('產生失敗，請再試一次', true); }
  busy(false);
  if(S.screen === 'standings'){ R.progs = {}; R.view = null; renderStandings(); }
}
async function clearDemoData(){
  if(isDemo) return;
  if(!confirm('要清除示範成績嗎？只會刪除標記為示範的資料。')) return;
  busy(true);
  try{
    const all = (await dbReq('GET', 'summary')) || {};
    const patch = {};
    Object.keys(all).forEach(k => { if(all[k] && all[k].demo) patch[k] = null; });
    if(Object.keys(patch).length) await dbReq('PATCH', 'summary', patch);
    toast('示範成績已清除 ✓');
  }catch(e){ console.error(e); toast('清除失敗，請再試一次', true); }
  busy(false);
  if(S.screen === 'standings'){ R.progs = {}; R.view = null; renderStandings(); }
}
async function toggleView(name){
  const key = keyOf(name);
  if(R.view && R.view.key === key){ R.view = null; paintStandings(); return; }
  R.view = {key, name, w:1};
  if(!R.progs[key]){
    busy(true);
    try{ R.progs[key] = await loadProg(key); }
    catch(e){ console.error(e); toast('照片讀取失敗，請再試一次', true); R.view = null; busy(false); paintStandings(); return; }
    busy(false);
  }
  const p = R.progs[key];
  for(let w = CONFIG.WEEKS; w >= 1; w--){
    if(TASKS.some(t => photosOf(wkIn(p, w), t.field).length)){ R.view.w = w; break; }
  }
  paintStandings();
}
function paintStandings(){
  const box = $('st');
  if(S.screen !== 'standings' || !box) return;
  if(R.err){
    box.innerHTML = '<div class="card"><p class="note" style="margin:0 0 10px">成績讀取失敗，請確認網路後再試一次。</p><button class="btn small" data-act="st-refresh">重新整理</button></div>';
    return;
  }
  const all = rosterStats();
  if(!all.length){
    box.innerHTML = '<div class="card"><span class="tag">成績榜</span><p class="note">參賽名單建立後，成績會顯示在這裡。</p></div>';
    return;
  }
  const people = all.length, passed = all.filter(r => r.n >= CONFIG.PASS).length;
  const overall = Math.round(all.reduce((b, r) => b + Math.min(1, r.n / CONFIG.PASS), 0) / people * 100);
  const rows = all.slice().sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'zh-Hant'));
  let html = '<div class="card"><div class="row"><span class="tag">成績榜</span><button class="btn ghost small" data-act="st-refresh">重新整理</button></div>' +
    (isDemo ? '<div class="banner" style="margin:0 0 10px">示範模式：先用範例數字展示，你自己的打卡會即時反映在自己的名字上。</div>' : '') +
    '<div class="stats"><div class="stat"><b>' + people + '</b><span>參賽人數</span></div><div class="stat"><b>' + passed + '</b><span>已通關</span></div><div class="stat"><b>' + overall + '%</b><span>全體進度</span></div></div>' +
    '<p class="note">進度 ＝ 完成週數 ÷ ' + CONFIG.PASS + '，完成 ' + CONFIG.PASS + ' 週就是 100%。</p></div>';
  html += '<div class="card" style="margin-top:18px"><div style="margin-top:2px">' +
    rows.map(r => {
      const key = keyOf(r.name), open = !!(R.view && R.view.key === key);
      let dots = '';
      for(let w = 1; w <= CONFIG.WEEKS; w++) dots += '<i class="' + (r.done.indexOf(w) >= 0 ? 'on' : '') + '" title="第 ' + w + ' 週"></i>';
      return '<div class="mrow"><div class="h"><b>' + esc(r.name) + '</b>' +
        (r.n >= CONFIG.PASS ? '<span class="chip red">通關 ★</span>' : '') + '<span class="r">' + r.pct + '%</span></div>' +
        '<p class="note" style="margin:2px 0 0">完成 ' + r.n + ' 週（通關要 ' + CONFIG.PASS + ' 週）</p>' +
        '<div class="dots" aria-label="12 週完成狀況">' + dots + '</div>' +
        '<p style="margin:10px 0 0"><button class="btn ghost small" data-act="view" data-v="' + esc(r.name) + '">' + (open ? '收起照片' : '看上傳的照片') + '</button></p>' +
        (open ? viewerHTML(key) : '') + '</div>';
    }).join('') + '</div></div>';
  box.innerHTML = html;
}

/* ---------- 後台（調整週次、刪除照片） ---------- */
const A = {ok:false, name:'', key:'', prog:null, open:0};
try{ A.ok = isDemo || sessionStorage.getItem('whc_adm') === '1'; }catch(e){ A.ok = isDemo; }
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
const memberOpts = names => names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
function renderAdmGate(){
  const setup = !CONFIG.ADMIN_HASH;
  $('app').innerHTML = heroHTML(true) + '<main class="wrap"><section><div class="card"><span class="tag red">後台登入</span>' +
    (setup ? '<p class="note" style="margin:0 0 6px">還沒設定後台密碼。輸入你要用的密碼（至少 8 個字元），按「產生代碼」，把代碼貼到 index.html 設定區的 ADMIN_HASH，重新上傳後就能用這組密碼登入。</p>' : '') +
    '<label class="lbl" for="adm-pw">' + (setup ? '想設定的密碼' : '後台密碼') + '</label><input id="adm-pw" class="inp" type="password" autocomplete="current-password">' +
    '<p style="margin:12px 0 0"><button class="btn" data-act="' + (setup ? 'adm-hash' : 'adm-login') + '">' + (setup ? '產生代碼' : '登入') + '</button></p>' +
    '<code class="out" id="adm-code" style="display:none"></code></div></section>' + footHTML() + '</main>';
}
async function admLogin(){
  try{
    if(await sha256($('adm-pw').value) === CONFIG.ADMIN_HASH){
      A.ok = true;
      try{ sessionStorage.setItem('whc_adm', '1'); }catch(e){}
      renderAdmin();
    }else toast('密碼不正確', true);
  }catch(e){ toast('這個瀏覽器無法驗證密碼，請用 https 網址開啟', true); }
}
async function admHash(){
  const pw = $('adm-pw').value;
  if(pw.length < 8){ toast('密碼請至少 8 個字元', true); return; }
  try{
    const c = $('adm-code'); c.textContent = await sha256(pw); c.style.display = 'block';
  }catch(e){ toast('這個瀏覽器無法產生代碼，請用 https 網址開啟', true); }
}
function admOut(){
  if(isDemo){ location.hash = ''; return; }
  A.ok = false; A.prog = null;
  try{ sessionStorage.removeItem('whc_adm'); }catch(e){}
  renderAdmin();
}
function renderAdmin(){
  S.screen = 'admin';
  if(!A.ok){ renderAdmGate(); return; }
  $('app').innerHTML = heroHTML(true) + '<main class="wrap">' +
    '<section><div class="me"><div><b>後台</b><small>' + (isDemo ? '示範模式：免密碼，資料在這台裝置' : '調整週次、刪除照片') + '</small></div><button data-act="adm-out">' + (isDemo ? '回打卡頁' : '退出') + '</button></div></section>' +
    (isDemo ? '' : '<section><div class="card"><span class="tag red">示範資料</span>' +
      '<p class="note" style="margin:0 0 10px">在「成績榜」灌入隨機進度方便展示，示範結束後按右邊按鈕一次清除，只會清掉標記為示範的資料，不會動到真實打卡。</p>' +
      '<div class="row" style="gap:10px"><button class="btn small" data-act="adm-demo-seed">🎲 產生示範成績</button><button class="btn ghost small" data-act="adm-demo-clear">🧹 清除示範成績</button></div></div></section>') +
    '<section><div class="card"><span class="tag red">選參賽者</span>' +
    '<label class="lbl" for="adm-member">姓名</label><select class="sel" id="adm-member" data-adm="member">' + memberOpts(allNames()) + '</select></div></section>' +
    '<section id="adm-edit"></section>' + footHTML() + '</main>';
  admLoad();
}
async function admLoad(){
  const names = allNames();
  if(names.indexOf(A.name) < 0) A.name = names[0] || '';
  const sel = $('adm-member'); if(sel) sel.value = A.name;
  if(!A.name){ A.prog = null; paintAdmEdit(); return; }
  A.key = keyOf(A.name);
  busy(true);
  try{ A.prog = await loadProg(A.key); }catch(e){ console.error(e); A.prog = null; toast('讀取失敗，請再試一次', true); }
  busy(false);
  paintAdmEdit();
}
function admShots(list, kind, w, f){
  if(!list.length) return '<p class="note" style="margin:4px 0 0">沒有照片</p>';
  return '<div class="ashots">' + list.map((p, i) =>
    '<figure class="ashot"><a href="' + esc(p.url) + '" target="_blank" rel="noopener"><img src="' + esc(p.thumb || p.url) + '" alt="第 ' + (i + 1) + ' 張"></a><div class="acts">' +
    (kind === 'task' ? '<button data-act="adm-mv" data-w="' + w + '" data-f="' + f + '" data-i="' + i + '">移週</button>' : '') +
    '<button class="d" data-act="adm-del" data-kind="' + kind + '" data-w="' + w + '" data-f="' + f + '" data-i="' + i + '">刪除</button></div></figure>').join('') + '</div>';
}
function paintAdmEdit(){
  const box = $('adm-edit');
  if(!box) return;
  const p = A.prog;
  if(!p){ box.innerHTML = ''; return; }
  const s = summaryOf(p, A.name), rc = toArr(p.recruitPhotos), mu = (p.mufo && p.mufo.url) ? [p.mufo] : [];
  let weeks = '';
  for(let w = 1; w <= CONFIG.WEEKS; w++){
    const x = wkIn(p, w), k = TASKS.filter(t => taskDone(t, x)).length;
    weeks += '<details' + (A.open === w ? ' open' : '') + '><summary>第 ' + w + ' 週　' + weekRange(w) + '　' + (k === TASKS.length ? '✓ 完成' : k + ' / ' + TASKS.length + ' 項') + '</summary><div class="in">' +
      TASKS.map(t => { const list = photosOf(x, t.field); return '<div class="adm-task"><b>' + esc(t.title) + '</b>　' + list.length + ' / ' + t.need + ' 張' + admShots(list, 'task', w, t.field) + '</div>'; }).join('') +
      '<p style="margin:10px 0 0"><button class="btn ghost small" data-act="adm-clear" data-w="' + w + '">清空這一週</button></p></div></details>';
  }
  box.innerHTML = '<div class="card"><span class="tag">' + esc(A.name) + '</span>' +
    '<div class="stats"><div class="stat"><b>' + s.n + '</b><span>完成週數</span></div><div class="stat"><b>' + rc.length + '</b><span>招募人數</span></div><div class="stat"><b>' + (mu.length ? '✓' : '—') + '</b><span>MUFO</span></div></div>' +
    weeks +
    '<details' + (A.open === 'r' ? ' open' : '') + '><summary>招募證明（' + rc.length + ' 張）</summary><div class="in">' + admShots(rc, 'recruit', 0, '') + '</div></details>' +
    '<details' + (A.open === 'm' ? ' open' : '') + '><summary>MUFO 完成畫面（' + (mu.length ? '已上傳' : '未上傳') + '）</summary><div class="in">' + admShots(mu, 'mufo', 0, '') + '</div></details></div>';
}
const admCtx = () => ({key:A.key, name:A.name, prog:A.prog});
async function admSave(fn){
  busy(true);
  try{ await fn(); toast('已更新 ✓'); }
  catch(e){ console.error(e); toast('更新失敗：' + (e && e.message ? e.message : '請再試一次'), true); busy(false); return admLoad(); }
  busy(false);
  paintAdmEdit();
}
function admDelete(el){
  const kind = el.dataset.kind, w = +el.dataset.w, f = el.dataset.f, i = +el.dataset.i;
  if(!confirm('確定要刪除這張照片嗎？刪除後隊員的進度會跟著更新。')) return;
  A.open = kind === 'task' ? w : (kind === 'recruit' ? 'r' : 'm');
  admSave(async () => {
    const ctx = admCtx();
    if(kind === 'task'){
      const list = photosOf(wkIn(A.prog, w), f).slice(); list.splice(i, 1);
      A.prog.weeks[w] = Object.assign({}, wkIn(A.prog, w), {[f]: list});
      await persistWeek(ctx, w, {[f]: list});
    }else if(kind === 'recruit'){
      const list = toArr(A.prog.recruitPhotos).slice(); list.splice(i, 1);
      A.prog.recruitPhotos = list;
      await persistRecruits(ctx);
    }else{
      A.prog.mufo = null;
      await persistMufo(ctx);
    }
  });
}
function admMove(el){
  const w = +el.dataset.w, f = el.dataset.f, i = +el.dataset.i;
  const raw = prompt('要把這張照片移到第幾週？（輸入 1 – ' + CONFIG.WEEKS + '）');
  if(raw === null) return;
  const to = parseInt(raw, 10);
  if(!(to >= 1 && to <= CONFIG.WEEKS) || to === w){ toast('請輸入 1 – ' + CONFIG.WEEKS + ' 之間、和現在不同的週次', true); return; }
  A.open = to;
  admSave(async () => {
    const ctx = admCtx();
    const src = photosOf(wkIn(A.prog, w), f).slice(), moved = src.splice(i, 1)[0];
    const dst = photosOf(wkIn(A.prog, to), f).concat([moved]);
    A.prog.weeks[w] = Object.assign({}, wkIn(A.prog, w), {[f]: src});
    A.prog.weeks[to] = Object.assign({}, wkIn(A.prog, to), {[f]: dst});
    await persistWeek(ctx, to, {[f]: dst});
    await persistWeek(ctx, w, {[f]: src});
  });
}
function admClear(w){
  if(!confirm('確定要清空第 ' + w + ' 週的所有照片嗎？')) return;
  A.open = w;
  admSave(async () => {
    const empty = {};
    TASKS.forEach(t => { empty[t.field] = []; });
    A.prog.weeks[w] = empty;
    await persistWeek(admCtx(), w, empty);
  });
}

/* 事件全部掛在 document 上（iOS 檔案選擇在重繪後仍然有效） */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const v = el.dataset.v;
  switch(el.dataset.act){
    case 'me':     pickMe(v); window.scrollTo(0, 0); break;
    case 'logout': LS.del('whc_me'); S.name = S.key = null; S.loaded = false; renderMe(); window.scrollTo(0, 0); break;
    case 'week':   S.sel = +v; paintBoard(); paintWeek(); break;
    case 'del':    deletePhoto(el.dataset.kind, el.dataset.field, +el.dataset.i); break;
    case 'nav':    location.hash = v; break;
    case 'st-refresh': R.progs = {}; R.view = null; renderStandings(); break;
    case 'view':   toggleView(v); break;
    case 'vweek':  if(R.view){ R.view.w = +v; paintStandings(); } break;
    case 'adm-login': admLogin(); break;
    case 'adm-hash':  admHash(); break;
    case 'adm-out':   admOut(); break;
    case 'adm-del':   admDelete(el); break;
    case 'adm-mv':    admMove(el); break;
    case 'adm-clear': admClear(+el.dataset.w); break;
    case 'adm-demo-seed': seedDemoData(); break;
    case 'adm-demo-clear': clearDemoData(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(!t || !t.matches) return;
  if(t.matches('input[type=file][data-upload]')) handleUpload(t);
  else if(t.matches('select[data-adm]')){
    A.name = t.value;
    A.open = 0;
    admLoad();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target && e.target.id === 'adm-pw'){
    const b = document.querySelector('[data-act=adm-login],[data-act=adm-hash]');
    if(b) b.click();
  }
});

/* ---------- 啟動 ---------- */
const me = LS.get('whc_me');
if(me && me.name && allNames().indexOf(me.name) >= 0){
  S.name = me.name; S.key = keyOf(me.name);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
