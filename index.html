<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMIC CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A66;--navy-2:#2B3880;--purple:#7F1085;--ink:#1f2328;--muted:#3D4E56;--line:#e3e6ee;--bg:#f5f6fa;--card:#fff;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
a{color:var(--navy)}
header{background:#fff;border-bottom:3px solid var(--navy);position:sticky;top:0;z-index:10}
.hin{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 24px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:700;color:var(--navy);font-size:24px;letter-spacing:.5px;white-space:nowrap;flex:none}
.brand .dot{color:var(--purple)}
.brand small{font-size:13px;color:var(--purple);font-weight:500;letter-spacing:1px}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;flex:none}
nav a.active{background:var(--navy);color:#fff}
.me{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap}
#meName{overflow:hidden;text-overflow:ellipsis}
main{max-width:1200px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:20px;color:var(--navy);margin:0 0 16px}
h2{font-size:16px;color:var(--navy);margin:0 0 12px;padding-left:10px;border-left:4px solid var(--purple)}
button{font:inherit;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500}
button.ghost{background:#fff;color:var(--navy)}
button.accent{background:var(--purple);border-color:var(--purple)}
button.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:-1px}
input:disabled{background:#f3f4f7}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input{max-width:260px}
.toolbar select{width:auto}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:var(--muted);padding:7px 14px}
.seg button.on{background:var(--navy);color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;background:#fafbfd}
th.sortable{cursor:pointer;user-select:none}
th .arrow{color:var(--purple)}
tbody.click tr{cursor:pointer}
tbody.click tr:hover{background:#f3f4fb}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag.potential{background:#f1e6f4;color:var(--purple)}
.tag.formal{background:#e5e8f5;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 20px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field .val{min-height:22px;word-break:break-all}
.checks{display:flex;flex-wrap:wrap;gap:16px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.checks input{width:auto}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
td.row-actions{display:table-cell;white-space:nowrap}
td.row-actions button{margin-right:6px}
td.row-actions button:last-child{margin-right:0}
.muted{color:var(--muted);font-size:13px}
.center{min-height:75vh;display:flex;align-items:center;justify-content:center}
.login{text-align:center;max-width:400px;width:100%}
.login .brand{justify-content:center;font-size:36px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50;max-width:90vw}
dialog{border:0;border-radius:12px;padding:24px;max-width:760px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,24,50,.45)}
.hidden{display:none!important}
.ver{text-align:center;color:#aab;font-size:11px;padding:8px 0 16px}
.card.warn{background:#FFF6E0;border-color:#F2C46B;color:#5a4300}
tr.left td{color:#9aa}
.bellwrap{position:relative}
.bell{padding:6px 10px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--purple);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.panel{position:absolute;right:0;top:44px;width:340px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(20,24,50,.15);z-index:30;text-align:left;color:var(--ink)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500}
.panel .ni{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.panel .ni:hover{background:#f3f4fb}
.panel .ni .t{font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{padding:6px;text-align:center;font-size:13px;color:var(--muted);background:#fafbfd;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.cal .dc.out{background:#fafbfd;color:#aab}
.cal .dc.today .dn{background:var(--navy);color:#fff;border-radius:999px;padding:0 6px}
.cal .dn{font-size:12px;display:inline-block;margin-bottom:2px}
.cal.week .dc{min-height:260px}
.ev{display:block;font-size:12px;padding:2px 6px;margin-bottom:2px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.ev.north{background:#3F51B5}
.ev.midsouth{background:#2E7D32}
.ev.leave{background:#D32F2F}
.ev.holiday{background:#F6C026;color:#3a2e00;cursor:default}
.ev.none{background:#78849E}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .north::before{background:#3F51B5}.legend .midsouth::before{background:#2E7D32}.legend .leave::before{background:#D32F2F}.legend .holiday::before{background:#F6C026}.legend .none::before{background:#78849E}.legend .plain::before{display:none}
.pick{max-height:320px;overflow:auto;margin-top:8px}
.pick div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick div:hover{background:#f3f4fb}
@media (max-width:640px){.cal .dc{min-height:64px}.ev{font-size:10px;padding:1px 3px}.panel{position:fixed;left:8px;right:8px;top:96px;width:auto}}
td.wrap{white-space:pre-wrap;min-width:180px;max-width:360px}
.files a{display:block;font-size:13px}
.filelist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.filelist span{display:flex;gap:8px;align-items:center;font-size:13px}
.x{background:none;border:0;color:var(--danger);padding:0 4px;cursor:pointer}
.small{padding:4px 10px;font-size:13px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-head h2{margin:0}
.full{grid-column:1/-1}
/* 中等寬度（平板、小筆電）：選單換到第二行 */
@media (max-width:1060px){
  .hin{flex-wrap:wrap;gap:6px 16px;padding:8px 20px 0}
  .me{margin-left:auto}
  nav{order:3;flex-basis:100%;padding-bottom:6px}
}
/* 手機 */
@media (max-width:640px){
  body{font-size:14px}
  .hin{padding:8px 12px 0;gap:4px 10px}
  .brand{font-size:20px}
  .brand small{font-size:11px}
  .me{gap:6px;font-size:12px;min-width:0;flex:1;justify-content:flex-end}
  #meName{max-width:38vw}
  .me button{padding:5px 10px;font-size:13px}
  .bell{padding:4px 8px}
  nav{margin:0 -12px;padding:0 12px 6px}
  nav a{padding:6px 12px;font-size:14px}
  main{padding:12px 10px}
  .card{padding:14px;border-radius:10px;margin-bottom:12px}
  h1{font-size:18px;margin-bottom:12px}
  .toolbar{gap:6px}
  .toolbar input,.toolbar select{flex:1 1 140px;max-width:none!important;min-width:0}
  .seg{max-width:100%;overflow-x:auto}
  .seg button{padding:6px 10px;white-space:nowrap;flex:none}
  .tablewrap{overflow:visible}
  .tablewrap thead{display:none}
  .tablewrap table,.tablewrap tbody,.tablewrap tr{display:block;width:100%}
  .tablewrap tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fff}
  .tablewrap td{display:flex;gap:10px;border:0;padding:3px 0;white-space:normal;word-break:break-word;font-size:14px}
  .tablewrap td::before{content:attr(data-label);flex:none;width:64px;color:var(--muted);font-size:12px;padding-top:2px}
  .tablewrap td[data-label=""]::before{display:none}
  .tablewrap td.wrap{min-width:0;max-width:none}
  .tablewrap td.row-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
  .tablewrap td.row-actions button{margin:0}
  .tablewrap .files{flex-direction:column}
  .grid{grid-template-columns:1fr 1fr;gap:10px 12px}
  dialog{padding:16px;width:calc(100% - 16px);max-height:calc(100vh - 32px)}
  dialog .grid{grid-template-columns:1fr}
  button{padding:7px 12px}
}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="hin">
  <div class="brand">tmic<span class="dot">.</span><small>CRM</small></div>
  <nav id="nav"></nav>
  <div class="me"><div class="bellwrap"><button class="ghost bell" id="bell" title="通知">🔔<span class="badge hidden" id="badge"></span></button><div class="panel hidden" id="npanel"></div></div><span id="meName"></span><button class="ghost" id="logout">登出</button></div>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="ver">版本 2026-10-12b</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, collectionGroup, doc, getDoc, getDocs, getDocsFromCache, query, where, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, runTransaction, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ====== 1. 貼上你的 Firebase 設定（Firebase 主控台 → 專案設定 → 網頁應用程式）======
const firebaseConfig = {
  apiKey: "AIzaSyAOCdAhjVrrO62dBATA4e7M0QEDDxo6sx4",
  authDomain: "tmic-crm-eeac3.firebaseapp.com",
  projectId: "tmic-crm-eeac3",
  storageBucket: "tmic-crm-eeac3.firebasestorage.app",
  messagingSenderId: "202695859419",
  appId: "1:202695859419:web:76d5a9799fc2c6a00300fe"
};
// ====== 2. 貼上 Google Apps Script 網頁應用程式網址（檔案上傳用）======
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbwOYummZ556WNrX-3ITTQZ8-wnNQBAc1SPNDAVL9wb0eE_Db4LSr1C3nq317XU3AakE/exec';
// ==========================================================================

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const ROLE = { admin: '管理者', manager: '業務主管', sales: '業務', engineer: '工程師' };
const REGIONS = ['台北', '台中', '台南'];
const REGION_CODE = { '台北': 'A', '台中': 'B', '台南': 'C' };
const LICENSES = [['serial', '單機綁序號'], ['dongle', '單機綁Dongle'], ['netPc', '網路綁電腦'], ['netDongle', '網路綁Dongle']];
const COMMON = [['name', '客戶名稱', true], ['companyProduct', '公司產品（客戶本業）'], ['industry', '行業別'], ['address', '公司地址'], ['currentSoftware', '現用軟體'], ['contact', '聯絡人'], ['phone', '電話'], ['mobile', '行動電話'], ['email', 'E-Mail'], ['website', '公司官網']];
const COUNTERS = [['lead_A', '台北潛在客戶', 'L-A'], ['lead_B', '台中潛在客戶', 'L-B'], ['lead_C', '台南潛在客戶', 'L-C'], ['formal', '正式客戶', 'C']];

let me = null;
const users = new Map();
const customers = new Map();
let lastSync = 0;
let unsubUsers = null;
let unsubNotes = null;
let notes = [];
let timer = null;
const ui = { status: 'all', region: '', sales: '', q: '', sort: 'no', dir: 1 };

const $ = s => document.querySelector(s);
const app = $('#app');
// 手機版表格改成卡片：每格加上欄位名稱
function labelTables() {
  document.querySelectorAll('.tablewrap table').forEach(t => {
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/[▲▼]/g, '').trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i] || ''); }));
  });
}
let labelPending = false;
new MutationObserver(() => { if (!labelPending) { labelPending = true; requestAnimationFrame(() => { labelPending = false; labelTables(); }); } }).observe(document.body, { childList: true, subtree: true });
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isAdmin = () => me?.role === 'admin';
const userRegions = u => Array.isArray(u?.regions) ? u.regions : (u?.region ? [u.region] : []);
const fmt = (prefix, n) => prefix + String(n).padStart(5, '0');
const custNo = c => (c.status === 'formal' ? c.formalNo : c.leadNo) || '';
const isLeft = email => users.get(email)?.active === false;
const salesLabel = email => { const u = users.get(email); return u ? `${u.nameZh || ''}${u.nameEn ? ' ' + u.nameEn : ''}${u.active === false ? '（離職）' : ''}` : (email || ''); };
const leftCustomers = () => [...customers.values()].filter(c => !c.deleted && c.salesEmail && isLeft(c.salesEmail));
const salesOptions = sel => [...users.values()].filter(u => (u.role === 'sales' || u.role === 'manager' || u.alsoSales) && (u.active !== false || u.email === sel))
  .sort((a, b) => (a.nameZh || '').localeCompare(b.nameZh || '', 'zh-Hant'))
  .map(u => `<option value="${esc(u.email)}" ${u.email === sel ? 'selected' : ''}>${esc(salesLabel(u.email))}</option>`).join('');

function toast(msg, ms = 3000) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms);
}
function errMsg(e) {
  if (e?.code === 'permission-denied') return '權限不足，無法執行';
  return e?.message || String(e);
}

// ---------------- 登入 ----------------
function viewLogin(msg) {
  $('#hdr').classList.add('hidden');
  app.innerHTML = `<div class="center"><div class="card login">
    <div class="brand">tmic<span class="dot">.</span><small>CRM</small></div>
    <p class="muted">明日國際 客戶管理系統</p>
    ${msg ? `<p style="color:var(--danger)">${esc(msg)}</p><button class="ghost" id="switch">切換帳號</button>` : '<button id="gl">使用 Google 帳號登入</button>'}
  </div></div>`;
  $('#gl')?.addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(errMsg(e))));
  $('#switch')?.addEventListener('click', async () => { await signOut(auth); signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(errMsg(e))); });
}

$('#logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async u => {
  me = null; customers.clear(); users.clear();
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  notes = []; renderBell();
  if (timer) { clearInterval(timer); timer = null; }
  if (!u) { viewLogin(); return; }
  const email = (u.email || '').toLowerCase();
  let snap = null;
  try { snap = await getDoc(doc(db, 'users', email)); } catch (e) { snap = null; }
  if (!snap || !snap.exists() || snap.data().active === false) {
    viewLogin(`${email} 尚未開通，請聯絡管理者加入人員名單。`);
    return;
  }
  me = { ...snap.data(), email };
  $('#hdr').classList.remove('hidden');
  $('#meName').textContent = `${me.nameZh || email}（${ROLE[me.role] || me.role}）`;
  app.innerHTML = '<div class="card"><p class="muted">載入資料中…</p></div>';

  unsubUsers = onSnapshot(collection(db, 'users'), s => {
    users.clear();
    s.forEach(d => users.set(d.id, { ...d.data(), email: d.id }));
    if (me && (!users.has(me.email) || users.get(me.email).active === false)) { signOut(auth); return; }
    if (!document.querySelector('dialog[open]')) route();
  });

  unsubNotes = onSnapshot(query(collection(db, 'notifications'), where('to', '==', me.email), where('read', '==', false)), s => {
    notes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    renderBell();
  }, () => {});

  // 同一台電腦換帳號登入時，不沿用上一位的本機暫存，改向伺服器重抓
  let switched = false;
  try { switched = localStorage.getItem('crm_last_user') !== email; localStorage.setItem('crm_last_user', email); } catch (e) { switched = true; }
  try { await syncCustomers(switched); } catch (e) { toast('客戶資料載入不完整：' + errMsg(e), 10000); }
  route();
  timer = setInterval(() => softRefresh(), 5 * 60 * 1000);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me && Date.now() - lastSync > 60 * 1000) softRefresh();
});

// ---------------- 客戶資料同步（只抓有變動的資料，節省讀取額度）----------------
function customersBaseQueries() {
  const col = collection(db, 'customers');
  if (me.role === 'sales') return [query(col, where('salesEmail', '==', me.email))];
  if (me.role === 'manager') {
    const qs = [query(col, where('salesEmail', '==', me.email))];
    const regs = userRegions(me);
    if (regs.length) qs.push(query(col, where('region', 'in', regs)));
    return qs;
  }
  return [col];
}
async function syncOne(base, full) {
  let max = null;
  if (!full) {
    try {
      const cached = await getDocsFromCache(base);
      cached.docs.forEach(d => {
        const data = d.data();
        customers.set(d.id, { id: d.id, ...data });
        if (!d.metadata.hasPendingWrites && data.updatedAt && (!max || data.updatedAt.toMillis() > max.toMillis())) max = data.updatedAt;
      });
    } catch (e) { /* 沒有快取時改抓全部 */ }
  }
  const snap = await getDocs(max ? query(base, where('updatedAt', '>', max)) : base);
  snap.docs.forEach(d => customers.set(d.id, { id: d.id, ...d.data() }));
}
async function syncCustomers(full = false) {
  if (full) customers.clear();
  for (const base of customersBaseQueries()) await syncOne(base, full);
  lastSync = Date.now();
}
async function softRefresh() {
  try { await syncCustomers(); if (!document.querySelector('dialog[open]')) route(); } catch (e) { /* 背景更新失敗時不打擾使用者 */ }
}

// ---------------- 路由 ----------------
function renderNav() {
  const h = location.hash || '#/customers';
  const items = [['#/customers', '客戶'], ['#/records', '紀錄'], ['#/calendar', '行事曆']];
  if (isAdmin()) items.push(['#/users', '人員管理'], ['#/settings', '編號設定'], ['#/import', '資料匯入']);
  $('#nav').innerHTML = items.map(([href, t]) => {
    const on = h.startsWith(href) || (href === '#/customers' && h.startsWith('#/customer/'));
    return `<a href="${href}" class="${on ? 'active' : ''}">${t}</a>`;
  }).join('');
}
function route() {
  if (!me) return;
  renderNav();
  const [, page, id] = (location.hash || '#/customers').split('/');
  if (page === 'customer' && id) viewCustomer(decodeURIComponent(id));
  else if (page === 'calendar') viewCalendar();
  else if (page === 'records') viewRecords();
  else if (page === 'users' && isAdmin()) viewUsers();
  else if (page === 'settings' && isAdmin()) viewSettings();
  else if (page === 'import' && isAdmin()) viewImport();
  else viewCustomers();
}
window.addEventListener('hashchange', route);

function renderTable() {
  const q = ui.q.trim().toLowerCase();
  const list = [...customers.values()].filter(c => !c.deleted)
    .filter(c => ui.status === 'all' || c.status === ui.status)
    .filter(c => !ui.region || (ui.region === '__none' ? !c.region : c.region === ui.region))
    .filter(c => !ui.sales || (ui.sales === '__left' ? (c.salesEmail && isLeft(c.salesEmail)) : ui.sales === '__check' ? c.needsCheck : c.salesEmail === ui.sales))
    .filter(c => !q || [custNo(c), c.leadNo, c.name, c.contact, c.phone, c.mobile].some(v => String(v || '').toLowerCase().includes(q)));
  const col = COLS.find(c => c[0] === ui.sort) || COLS[0];
  list.sort((a, b) => String(col[2](a) || '').localeCompare(String(col[2](b) || ''), 'zh-Hant', { numeric: true }) * ui.dir);
  $('#thead').innerHTML = COLS.map(([k, t]) => `<th class="sortable" data-k="${k}">${t}${ui.sort === k ? `<span class="arrow">${ui.dir > 0 ? ' ▲' : ' ▼'}</span>` : ''}</th>`).join('');

  $('#count').textContent = `共 ${list.length} 筆`;
}

// ---------------- 新增／編輯客戶 ----------------
function customerForm(c, preset = {}, onCreated = null) {
  const isNew = !c;
  const cur = c || { status: 'potential', license: {}, ...preset };
  const inp = (k, t, req) => `<div class="field"><label>${t}${req ? ' *' : ''}</label><input name="${k}" value="${esc(cur[k])}"></div>`;
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form id="cf">
    <h1>${isNew ? '新增客戶' : `編輯客戶　${esc(custNo(cur))}`}</h1>
    <div class="grid">
      ${isNew ? '<div class="field"><label>類型 *</label><select name="status"><option value="potential">潛在客戶</option><option value="formal">正式客戶</option></select></div>' : ''}
      ${!isNew ? `<div class="field"><label>潛在編號</label><input name="leadNo" value="${esc(cur.leadNo)}" placeholder="L-A00001"><button type="button" class="ghost small" data-newno="lead" style="margin-top:6px">取用新的 L 編號</button></div>
      ${cur.status === 'formal' ? `<div class="field"><label>正式編號 *</label><input name="formalNo" value="${esc(cur.formalNo)}" placeholder="C00001"><button type="button" class="ghost small" data-newno="formal" style="margin-top:6px">取用新的 C 編號</button></div>` : ''}` : ''}
      <div class="field"><label>區域</label><select name="region"><option value="">（未分區）</option>${REGIONS.map(r => `<option ${cur.region === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>負責業務</label><select name="salesEmail"><option value="">（未指定）</option>${salesOptions(cur.salesEmail)}</select></div>
      ${COMMON.map(([k, t, r]) => inp(k, t, r)).join('')}
    </div>
    <div id="formalPart">
      <h2 style="margin-top:20px">產品與授權</h2>
      <div class="grid">${inp('purchasedProduct', '購買產品')}<div class="field"><label>維護日期</label><input type="date" name="maintenanceDate" value="${esc(cur.maintenanceDate)}"></div></div>
      <div class="checks" style="margin-top:12px">${LICENSES.map(([k, t]) => `<label><input type="checkbox" name="lic_${k}" ${cur.license?.[k] ? 'checked' : ''}>${t}</label>`).join('')}</div>
    </div>
    <div class="row-actions" style="margin-top:24px;justify-content:flex-end">
      <button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button>
    </div>
  </form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#cf');
  const statusNow = () => isNew ? form.status.value : cur.status;
  const togglePart = () => dlg.querySelector('#formalPart').classList.toggle('hidden', statusNow() !== 'formal');
  togglePart();
  if (isNew) form.status.addEventListener('change', togglePart);
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').addEventListener('click', close);
  dlg.addEventListener('cancel', () => dlg.remove());
  dlg.querySelectorAll('[data-newno]').forEach(btn => btn.addEventListener('click', async () => {
    const kind = btn.dataset.newno;
    const region = form.region.value;
    if (kind === 'lead' && !REGION_CODE[region]) return toast('請先選區域，才能產生 L 編號');
    if (!confirm('會用掉一個新號碼，確定取用？')) return;
    try {
      const key = kind === 'formal' ? 'formal' : 'lead_' + REGION_CODE[region];
      const no = await runTransaction(db, async tx => {
        const ref = doc(db, 'counters', key); const s0 = await tx.get(ref);
        const n = s0.exists() ? s0.data().next : 1; tx.set(ref, { next: n + 1 });
        return kind === 'formal' ? fmt('C', n) : fmt('L-' + REGION_CODE[region], n);
      });
      form[kind === 'formal' ? 'formalNo' : 'leadNo'].value = no;
      toast('已填入 ' + no + '，按儲存後生效');
    } catch (err) { toast(errMsg(err)); }
  }));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(form);
    const status = statusNow();
    const data = {};
    COMMON.forEach(([k]) => (data[k] = String(fd.get(k) || '').trim()));
    data.region = fd.get('region') || '';
    data.salesEmail = fd.get('salesEmail') || '';
    if (status === 'formal') {
      data.purchasedProduct = String(fd.get('purchasedProduct') || '').trim();
      data.maintenanceDate = fd.get('maintenanceDate') || '';
      data.license = Object.fromEntries(LICENSES.map(([k]) => [k, fd.get('lic_' + k) === 'on']));
    }
    if (!data.name) return toast('請填寫客戶名稱');
    if (isNew && status === 'potential' && !data.region) return toast('潛在客戶必須選擇區域（用來產生 L 編號）');
    if (!isNew) {
      const lead = String(fd.get('leadNo') || '').trim().toUpperCase();
      const formal = String(fd.get('formalNo') ?? cur.formalNo ?? '').trim().toUpperCase();
      if (lead && !/^L-[ABC]\d{5}$/.test(lead)) return toast('潛在編號格式應為 L-A00001（A 台北、B 台中、C 台南）');
      if (status === 'potential' && !lead) return toast('潛在客戶必須有潛在編號');
      if (status === 'formal' && !/^C\d{5}$/.test(formal)) return toast('正式編號格式應為 C00001');
      const clash = [...customers.values()].find(x => x.id !== cur.id && !x.deleted && ((lead && x.leadNo === lead) || (status === 'formal' && x.formalNo === formal)));
      if (clash) return toast(`編號已被使用：${custNo(clash)} ${clash.name}`, 6000);
      data.leadNo = lead;
      if (status === 'formal') data.formalNo = formal;
    }
    dlg.querySelector('#save').disabled = true;
    try {
      let id = cur.id;
      if (isNew) {
        await runTransaction(db, async tx => {
          const key = status === 'formal' ? 'formal' : 'lead_' + REGION_CODE[data.region];
          const cref = doc(db, 'counters', key);
          const s = await tx.get(cref);
          const n = s.exists() ? s.data().next : 1;
          const ref = doc(collection(db, 'customers'));
          tx.set(cref, { next: n + 1 });
          tx.set(ref, {
            ...data, status,
            leadNo: status === 'potential' ? fmt('L-' + REGION_CODE[data.region], n) : '',
            formalNo: status === 'formal' ? fmt('C', n) : '',
            deleted: false, createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp()
          });
          id = ref.id;
        });
      } else {
        await updateDoc(doc(db, 'customers', cur.id), { ...data, needsCheck: false, updatedBy: me.email, updatedAt: serverTimestamp() });
      }
      close();
      await syncCustomers();
      toast('已儲存');
      if (isNew && onCreated) { try { await onCreated(id); } catch (e2) { /* 連結行程失敗不影響客戶建立 */ } }
      if (isNew) location.hash = '#/customer/' + encodeURIComponent(id); else route();
    } catch (err) {
      toast(errMsg(err));
      dlg.querySelector('#save').disabled = false;
    }
  });
  dlg.showModal();
}

async function convertToFormal(c) {
  if (!confirm(`確定將 ${c.leadNo} ${c.name} 轉為正式客戶？\n系統會產生新的 C 編號，原 L 編號保留。`)) return;
  try {
    await runTransaction(db, async tx => {
      const cref = doc(db, 'counters', 'formal');
      const ref = doc(db, 'customers', c.id);
      const s = await tx.get(cref);
      const cs = await tx.get(ref);
      if (!cs.exists() || cs.data().status !== 'potential') throw new Error('此客戶已不是潛在客戶');
      const n = s.exists() ? s.data().next : 1;
      tx.set(cref, { next: n + 1 });
      tx.update(ref, { status: 'formal', formalNo: fmt('C', n), convertedAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() });
    });
    await syncCustomers();
    route();
    toast('已轉為正式客戶，請補填產品與授權資料');
    customerForm(customers.get(c.id));
  } catch (e) { toast(errMsg(e)); }
}

async function deleteCustomer(c) {
  if (!confirm(`確定刪除 ${custNo(c)} ${c.name}？`)) return;
  try {
    await updateDoc(doc(db, 'customers', c.id), { deleted: true, updatedBy: me.email, updatedAt: serverTimestamp() });
    await syncCustomers();
    toast('已刪除');
    location.hash = '#/customers';
  } catch (e) { toast(errMsg(e)); }
}

function recCol(key, c) { return REC[key].top ? collection(db, key) : collection(db, 'customers', c.id, key); }
async function loadRecords(c) {

  recCache.set(c.id, out);

}

    const rows = [...(data[k] || [])].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    const cell = (r, [f, , fn, wrap]) => {
      if (f === 'files') return `<td class="files">${(r.files || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('') || '—'}</td>`;
      if (f === 'link' && r.link) return `<td><a href="${esc(r.link)}" target="_blank" rel="noopener">開啟</a></td>`;
      const v = fn ? fn(r) : r[f];
      return `<td class="${wrap ? 'wrap' : ''}">${esc(v) || '—'}</td>`;
    };
    return `<div class="card" data-k="${k}">
      <div class="sec-head"><h2>${R.title}</h2><span class="muted">${rows.length} 筆</span><span class="spacer"></span>${R.canAdd() ? `<button class="small" data-act="add">＋ 新增</button>` : ''}</div>
      ${rows.length ? `<div class="tablewrap"><table><thead><tr>${R.cols.map(([, t]) => `<th>${t}</th>`).join('')}<th>建立者</th><th></th></tr></thead><tbody>
        ${rows.map(r => `<tr data-id="${esc(r.id)}">${R.cols.map(col => cell(r, col)).join('')}<td>${esc(salesLabel(r.createdBy))}</td>
          <td class="row-actions">${R.canEdit(r) ? '<button class="ghost small" data-act="edit">編輯</button>' : ''}${R.canDel(r) ? '<button class="danger small" data-act="del">刪除</button>' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">尚無紀錄</p>'}
    </div>`;
  }).join('');
  box.querySelectorAll('.card[data-k]').forEach(card => card.addEventListener('click', async e => {
    const act = e.target.dataset.act; if (!act) return;
    const k = card.dataset.k; const id = e.target.closest('tr')?.dataset.id;
    const r = id ? (recCache.get(c.id)[k] || []).find(x => x.id === id) : null;
    if (act === 'add') recordForm(k, c, null);
    if (act === 'edit' && r) recordForm(k, c, r);
    if (act === 'del' && r) {
      if (!confirm(`確定刪除這筆${REC[k].title}？`)) return;
      try { await deleteDoc(doc(recCol(k, c), r.id)); toast('已刪除'); if (k === 'schedules') schedCache.clear(); afterRecordChange(c); } catch (err) { toast(errMsg(err)); }
    }
  }));
}

async function uploadFile(file, kind, customerNo) {
  if (!UPLOAD_URL) throw new Error('尚未設定檔案上傳網址（UPLOAD_URL）');
  if (file.size > 10 * 1024 * 1024) throw new Error(`${file.name} 超過 10MB`);
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
  const j = await callScript('upload', { kind, customerNo, name: file.name, mimeType: file.type, data });
  return { name: j.name, url: j.url };
}
async function callScript(action, payload) {
  if (!UPLOAD_URL) throw new Error('尚未設定 Apps Script 網址');
  const idToken = await auth.currentUser.getIdToken();
  const resp = await fetch(UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, idToken, ...payload }) });
  const j = await resp.json();
  if (!j.ok) throw new Error(j.error || '執行失敗');
  return j;
}
// 行程建立後：系統內通知＋Email
async function notifySchedule(id, data) {
  const to = [...new Set([data.salesEmail, data.engineerEmail].filter(Boolean))];
  if (!to.length) return;
  const title = `新行程：${data.title}`;
  const body = `${dateRangeText(data)} ${timeText(data)}｜${SCHED_TYPE[data.type] || ''}`;
  for (const email of to) {
    try { await addDoc(collection(db, 'notifications'), { to: email, from: me.email, title, body, scheduleId: id, date: data.date, read: false, createdAt: serverTimestamp() }); } catch (e) { /* 單筆失敗不影響其他 */ }
  }
  try {
    const j = await callScript('notify', { scheduleId: id });
    toast(j.sent ? `已寄出 Email 給 ${j.sent} 人` : 'Email 未寄出：Apps Script 回傳 0 位收件人（可能尚未更新為新版程式）', 10000);
  } catch (e) { toast('行程已儲存，但 Email 通知失敗：' + errMsg(e), 10000); }
}

function recordForm(k, c, r, preset = {}) {
  const R = REC[k];
  const isNew = !r;
  const cur = r || Object.assign(['demos', 'schedules'].includes(k) ? { type: me.role === 'engineer' ? 'engineer' : 'sales', date: new Date().toLocaleDateString('sv-SE'), salesEmail: ['sales', 'manager'].includes(me.role) ? me.email : (c.salesEmail || ''), engineerEmail: me.role === 'engineer' ? me.email : '' } : { date: new Date().toLocaleDateString('sv-SE') }, preset);
  let files = [...(cur.files || [])];
  const lock = k === 'demos' && !isAdmin() && demoTypes().length === 1 ? demoTypes()[0] : null;
  if (lock) { cur.type = lock; if (lock === 'sales') cur.salesEmail = me.email; else cur.engineerEmail = me.email; }
  const field = ([f, t, type, req, opt, full]) => {
    const lab = `<label>${t}${req ? ' *' : ''}</label>`;
    const cls = `field${full ? ' full' : ''}`;
    if (lock && f === 'type') return `<div class="${cls}">${lab}<input type="hidden" name="type" value="${lock}"><div class="val">${DEMO_TYPE[lock]}</div></div>`;
    if (lock && ((lock === 'sales' && f === 'salesEmail') || (lock === 'engineer' && f === 'engineerEmail'))) return `<div class="${cls}">${lab}<input type="hidden" name="${f}" value="${esc(me.email)}"><div class="val">${esc(salesLabel(me.email))}</div></div>`;
    if (type === 'textarea') return `<div class="${cls}">${lab}<textarea name="${f}" rows="4">${esc(cur[f])}</textarea></div>`;
    if (type === 'date') return `<div class="${cls}">${lab}<input type="date" name="${f}" value="${esc(cur[f])}"></div>`;
    if (type === 'time') return `<div class="${cls}">${lab}<input type="time" name="${f}" value="${esc(cur[f])}"></div>`;
    if (type === 'sched') {
      const list = [...((recCache.get(c.id) || {}).schedules || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      return `<div class="${cls}">${lab}<select name="${f}"><option value="">（不指定）</option>${list.map(x => `<option value="${esc(x.id)}" ${cur[f] === x.id ? 'selected' : ''}>${esc(x.date)} ${esc(x.startTime)} ${esc(DEMO_TYPE[x.type] || '')}</option>`).join('')}</select></div>`;
    }
    if (type === 'select') return `<div class="${cls}">${lab}<select name="${f}">${opt().map(([v, tt]) => `<option value="${v}" ${cur[f] === v ? 'selected' : ''}>${tt}</option>`).join('')}</select></div>`;
    if (type === 'user') return `<div class="${cls}">${lab}<select name="${f}"><option value="">（未指定）</option>${userOptions(opt, cur[f])}</select></div>`;
    if (type === 'list') return `<div class="${cls}">${lab}<input name="${f}" list="dl_${f}" value="${esc(cur[f])}"><datalist id="dl_${f}">${opt.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>`;
    if (type === 'files') return `<div class="${cls}">${lab}<div class="filelist" id="flist"></div><input type="file" name="__files" multiple accept=".pdf,image/*,.lic,.dat,.txt,.zip"><div class="muted">每個檔案 10MB 以內，存放於 Google Drive</div></div>`;
    return `<div class="${cls}">${lab}<input name="${f}" value="${esc(cur[f])}"${f === 'participants' ? ' placeholder="多位用頓號隔開，例：林工程師、王經理"' : ''}></div>`;
  };
  const dlg = document.createElement('dialog');
  let target = c; // 管理者可在編輯時更換連結客戶
  const custLine = () => `<span id="custName">${esc(custNo(target))}　${esc(target.name)}</span>${target.id !== c.id ? ' <span class="tag potential">將更換</span>' : ''}`;
  dlg.innerHTML = `<form id="rf"><h1>${isNew ? '新增' : '編輯'}${R.title}</h1><p class="muted" id="custLine">${custLine()}</p>${!isNew && isAdmin() ? '<p><button type="button" class="ghost small" id="chgCust">更換連結客戶</button></p>' : ''}
    <div class="grid">${R.fields.map(field).join('')}</div>
    <div class="row-actions" style="margin-top:24px;justify-content:flex-end"><button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button></div></form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#rf');
  dlg.querySelector('#chgCust')?.addEventListener('click', () => {
    dlg.close();
    pickCustomer(c2 => { if (c2) { target = c2; dlg.querySelector('#custLine').innerHTML = custLine(); } dlg.showModal(); }, () => dlg.showModal());
  });
  const drawFiles = () => { const fl = dlg.querySelector('#flist'); if (fl) fl.innerHTML = files.map((x, i) => `<span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a><button type="button" class="x" data-i="${i}">✕</button></span>`).join(''); };
  drawFiles();
  dlg.querySelector('#flist')?.addEventListener('click', e => { const i = e.target.dataset.i; if (i !== undefined) { files.splice(Number(i), 1); drawFiles(); } });
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').addEventListener('click', close);
  dlg.addEventListener('cancel', () => dlg.remove());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    for (const [f, t, type, req] of R.fields) {
      if (type === 'files') continue;
      data[f] = String(form[f].value || '').trim();
      if (req && !data[f]) return toast(`請填寫${t}`);
    }
    const saveBtn = dlg.querySelector('#save');
    saveBtn.disabled = true;
    try {
      const picker = form.querySelector('input[name=__files]');
      if (picker && picker.files.length) {
        saveBtn.textContent = '上傳中…';
        for (const f of picker.files) files.push(await uploadFile(f, R.kind, custNo(c) || c.leadNo || c.id));
      }
      if (R.fields.some(x => x[2] === 'files')) data.files = files;
      if (R.top) Object.assign(data, { customerId: target.id, customerName: target.name || '', customerNo: custNo(target), region: target.region || '' });
      if (k === 'demos' && cur.scheduleId) data.scheduleId = cur.scheduleId;
      if (k === 'demos' && !isAdmin() && !demoTypes().includes(data.type)) throw new Error('你不能填寫這種 Demo 紀錄');
      if (k === 'schedules' && data.endTime && data.endTime < data.startTime) throw new Error('結束時間不能早於開始時間');
      let newId = null;
      if (isNew) newId = (await addDoc(recCol(k, c), { ...data, createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() })).id;
      else if (!R.top && target.id !== c.id) {
        // 子紀錄換客戶：搬到新客戶底下，刪除舊的
        const { id: _id, customerId: _cid, ...old } = r;
        const b = writeBatch(db);
        b.set(doc(recCol(k, target), r.id), { ...old, ...data, updatedBy: me.email, updatedAt: serverTimestamp() });
        b.delete(doc(recCol(k, c), r.id));
        await b.commit();
      }
      else await updateDoc(doc(recCol(k, c), r.id), { ...data, updatedBy: me.email, updatedAt: serverTimestamp() });
      close(); toast(target.id !== c.id ? `已儲存，並改連結到 ${target.name}` : '已儲存');
      if (target.id !== c.id) { recCache.delete(target.id); recsCache.clear(); }
      if (k === 'schedules') { schedCache.clear(); if (isNew) notifySchedule(newId, data); }
      afterRecordChange(c);
    } catch (err) { toast(errMsg(err)); saveBtn.disabled = false; saveBtn.textContent = '儲存'; }
  });
  dlg.showModal();
}

// ---------------- 行事曆 ----------------
const SCHED_TYPE = { sales: '業務 Demo', engineer: '工程師 Demo', class: '上課', leave: '休假', other: '其他' };
const cal = { view: 'month', cursor: new Date().toLocaleDateString('sv-SE'), region: '', person: '', type: '' };
const schedCache = new Map(); // 'YYYY-MM' -> [schedules]
const holidayCache = new Map(); // 'YYYY' -> Map(date -> name)
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymdOf = d => d.toLocaleDateString('sv-SE');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const endOf = x => x.endDate && x.endDate > x.date ? x.endDate : x.date;
const dateRangeText = x => endOf(x) !== x.date ? `${x.date}～${endOf(x)}` : x.date;
const timeText = x => x.startTime ? x.startTime + (x.endTime ? '～' + x.endTime : '') : '全天';
const evColor = x => x.type === 'leave' ? 'leave' : x.region === '台北' ? 'north' : (x.region === '台中' || x.region === '台南') ? 'midsouth' : 'none';

function afterRecordChange(c) {
  if (c?.id) recCache.delete(c.id);
  recsCache.clear();
  if (location.hash.startsWith('#/calendar')) viewCalendar();
  else if (location.hash.startsWith('#/records')) viewRecords();
  else if (c) showRecords(c, true);
}
async function loadMonth(ym) {
  if (schedCache.has(ym)) return schedCache.get(ym);
  const snap = await getDocs(query(collection(db, 'schedules'), where('date', '>=', ym + '-01'), where('date', '<=', ym + '-31')));
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  schedCache.set(ym, list);
  return list;
}
// 台灣國定假日（資料來源：行政院人事行政總處辦公日曆表，ruyut/TaiwanCalendar 整理）
async function loadHolidays(year) {
  if (holidayCache.has(year)) return holidayCache.get(year);
  const m = new Map();
  try {
    const r = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`);
    if (r.ok) (await r.json()).forEach(d => { if (d.isHoliday && d.description) m.set(`${d.date.slice(0, 4)}-${d.date.slice(4, 6)}-${d.date.slice(6, 8)}`, d.description); });
  } catch (e) { /* 抓不到就不顯示假日 */ }
  holidayCache.set(year, m);
  return m;
}
function calRange() {
  const cur = toDate(cal.cursor);
  if (cal.view === 'week') { const start = addDays(cur, -cur.getDay()); return [start, addDays(start, 6)]; }
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  if (cal.view === 'list') return [first, last];
  return [addDays(first, -first.getDay()), addDays(last, 6 - last.getDay())];
}
async function viewCalendar() {
  const [start, end] = calRange();
  const s0 = ymdOf(start), s1 = ymdOf(end);
  const months = []; // 多抓前一個月，才看得到跨月的行程
  for (let d = new Date(start.getFullYear(), start.getMonth() - 1, 1); ymdOf(d).slice(0, 7) <= s1.slice(0, 7); d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(ymdOf(d).slice(0, 7));
  let all = []; const hol = new Map();
  try {
    for (const m of months) all = all.concat(await loadMonth(m));
    for (const y of [...new Set([s0.slice(0, 4), s1.slice(0, 4)])]) (await loadHolidays(y)).forEach((v, k) => hol.set(k, v));
  } catch (e) { app.innerHTML = `<div class="card"><p>行程載入失敗：${esc(errMsg(e))}</p></div>`; return; }
  if (!location.hash.startsWith('#/calendar')) return;
  const list = all.filter(x => x.date <= s1 && endOf(x) >= s0)
    .filter(x => !cal.region || x.region === cal.region)
    .filter(x => !cal.person || x.salesEmail === cal.person || x.engineerEmail === cal.person)
    .filter(x => !cal.type || x.type === cal.type)
    .sort((a, b) => (a.date + (a.startTime || '')).localeCompare(b.date + (b.startTime || '')));
  const cur = toDate(cal.cursor);
  const title = cal.view === 'week' ? `${s0} ～ ${s1}` : `${cur.getFullYear()} 年 ${cur.getMonth() + 1} 月`;
  const today = ymdOf(new Date());
  const chip = x => `<span class="ev ${evColor(x)}" data-sid="${esc(x.id)}" title="${esc(x.title)}">${x.startTime ? esc(x.startTime) + ' ' : ''}${esc(x.title)}</span>`;
  let body = '';
  if (cal.view === 'list') {
    const hols = [...hol].filter(([d]) => d >= s0 && d <= s1);
    body = (list.length || hols.length) ? `<div class="tablewrap"><table><thead><tr><th>日期</th><th>時間</th><th>標題</th><th>類型</th><th>區域</th><th>業務</th><th>工程師</th><th>地點</th></tr></thead><tbody class="click">
      ${hols.map(([d, n]) => `<tr><td>${d}（${WD[toDate(d).getDay()]}）</td><td>全天</td><td><span class="ev holiday">${esc(n)}</span></td><td>國定假日</td><td></td><td></td><td></td><td></td></tr>`).join('')}
      ${list.map(x => `<tr data-sid="${esc(x.id)}"><td>${esc(dateRangeText(x))}</td><td>${esc(timeText(x))}</td><td><span class="ev ${evColor(x)}">${esc(x.title)}</span></td><td>${SCHED_TYPE[x.type] || ''}</td><td>${esc(x.region)}</td><td>${esc(salesLabel(x.salesEmail))}</td><td>${esc(salesLabel(x.engineerEmail))}</td><td>${esc(x.place)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">這個月沒有行程</p>';
  } else {
    const days = []; for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(ymdOf(d));
    body = `<div class="cal ${cal.view === 'week' ? 'week' : ''}">${WD.map(w => `<div class="dh">${w}</div>`).join('')}${days.map(d => {
      const dd = toDate(d); const out = cal.view === 'month' && dd.getMonth() !== cur.getMonth();
      return `<div class="dc ${out ? 'out' : ''} ${d === today ? 'today' : ''}" data-day="${d}"><span class="dn">${cal.view === 'week' ? (dd.getMonth() + 1) + '/' : ''}${dd.getDate()}</span>${hol.has(d) ? `<span class="ev holiday">${esc(hol.get(d))}</span>` : ''}${list.filter(x => x.date <= d && endOf(x) >= d).map(chip).join('')}</div>`;
    }).join('')}</div>`;
  }
  app.innerHTML = `<div class="card">
    <div class="toolbar"><h1 style="margin:0">行事曆</h1><span class="spacer"></span><button id="addS">＋ 新增行程</button></div>
    <div class="toolbar">
      <button class="ghost small" id="prev">‹</button><button class="ghost small" id="today">今天</button><button class="ghost small" id="next">›</button>
      <strong style="margin:0 8px">${title}</strong>
      <div class="seg" id="vseg">${[['month', '月'], ['week', '週'], ['list', '清單']].map(([k, t]) => `<button data-v="${k}" class="${cal.view === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <span class="spacer"></span>
      <select id="cRegion"><option value="">全部區域</option>${REGIONS.map(r => `<option ${cal.region === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <select id="cPerson"><option value="">全部人員</option>${userOptions(['sales', 'manager', 'engineer', 'admin'], cal.person)}</select>
      <select id="cType"><option value="">全部類型</option>${Object.entries(SCHED_TYPE).map(([k, t]) => `<option value="${k}" ${cal.type === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="ghost small" id="cRefresh">重新整理</button>
    </div>
    <div class="muted" style="margin-bottom:8px">共 ${list.length} 筆行程</div>
    ${body}
    <div class="legend"><span class="north">北區</span><span class="midsouth">中區／南區</span><span class="leave">休假</span><span class="holiday">國定假日</span><span class="none">未分區</span>${cal.view !== 'list' ? '<span class="plain">點空白日期可新增行程</span>' : ''}</div>
  </div>`;
  const move = n => { const c0 = toDate(cal.cursor); cal.cursor = ymdOf(cal.view === 'week' ? addDays(c0, 7 * n) : new Date(c0.getFullYear(), c0.getMonth() + n, 1)); viewCalendar(); };
  $('#prev').onclick = () => move(-1); $('#next').onclick = () => move(1);
  $('#today').onclick = () => { cal.cursor = ymdOf(new Date()); viewCalendar(); };
  $('#vseg').onclick = e => { const v = e.target.dataset.v; if (v) { cal.view = v; viewCalendar(); } };
  $('#cRegion').onchange = e => { cal.region = e.target.value; viewCalendar(); };
  $('#cPerson').onchange = e => { cal.person = e.target.value; viewCalendar(); };
  $('#cType').onchange = e => { cal.type = e.target.value; viewCalendar(); };
  $('#cRefresh').onclick = () => { schedCache.clear(); viewCalendar(); };
  $('#addS').onclick = () => scheduleForm(null, { date: cal.cursor });

// 從行程內容自動帶入潛在客戶欄位（「標籤：內容」格式的每一行）
const SCHED_LABELS = [
  ['name', ['客戶名稱', '客戶全稱', '公司名稱']],
  ['contact', ['聯絡窗口', '聯繫窗口', '聯絡人']],
  ['mobile', ['行動電話', '手機']],
  ['phone', ['聯絡電話', '電話']],
  ['address', ['公司地址', '地址']],
  ['companyProduct', ['公司產品']],
  ['currentSoftware', ['使用軟體', '公司軟體', '現用軟體']],
  ['industry', ['行業別']],
  ['email', ['E-Mail', 'Email', '信箱']],
  ['website', ['公司官網', '官網', '公司網址']]
];
function scheduleToCustomer(x) {
  const out = { status: 'potential', region: x.region || '', salesEmail: x.salesEmail || '' };
  for (const line of String(x.content || '').split('\n')) {
    const m = line.match(/^\s*([^：:]{1,12})\s*[：:]\s*(.+?)\s*$/);
    if (!m) continue;
    const hit = SCHED_LABELS.find(([, labels]) => labels.some(l => l.toLowerCase() === m[1].trim().toLowerCase()));
    if (!hit || out[hit[0]]) continue;
    out[hit[0]] = m[2];
  }
  // 「04-7683999 / 0981-315905」：09 開頭的拆到行動電話
  if (out.phone && /[\/／]/.test(out.phone)) {
    const parts = out.phone.split(/\s*[\/／]\s*/);
    const mob = parts.find(p => /^09/.test(p.replace(/\D/g, '')));
    if (mob && !out.mobile) { out.mobile = mob; out.phone = parts.filter(p => p !== mob).join(' / '); }
  }
  if (!out.address && x.place) out.address = x.place;
  if (!out.name) out.name = String(x.title || '').split(/[-－\[［(（]/)[0].trim();
  return out;
}

const UNLINKED_ID = 'imp_unlinked';
const toRow = d => ({ id: d.id, ...d.data(), customerId: d.data().customerId || d.ref.parent.parent?.id });
// 「全部」：先讀本機快取，再只向伺服器抓有變動的，節省讀取額度
async function loadRecsAll(col, full = false) {
  const key = col + '|all';
  if (recsCache.has(key) && !full) return recsCache.get(key);
  const base = col === 'demos' ? collection(db, 'demos') : collectionGroup(db, col);
  const map = new Map(); let max = null;
  if (!full) {
    try {
      (await getDocsFromCache(base)).docs.forEach(d => {
        map.set(d.ref.path, toRow(d));
        const u = d.data().updatedAt;
        if (!d.metadata.hasPendingWrites && u && (!max || u.toMillis() > max.toMillis())) max = u;
      });
    } catch (e) { /* 沒有快取就全部抓 */ }
  }
  (await getDocs(max ? query(base, where('updatedAt', '>', max)) : base)).docs.forEach(d => map.set(d.ref.path, toRow(d)));
  const rows = [...map.values()];
  recsCache.set(key, rows);
  return rows;
}
async function loadRecsMonth(col, ym) {
  if (ym === 'all') return loadRecsAll(col);
  const key = col + '|' + ym;
  if (recsCache.has(key)) return recsCache.get(key);
  const range = [where('date', '>=', ym + '-01'), where('date', '<=', ym + '-31')];
  const snap = await getDocs(col === 'demos' ? query(collection(db, 'demos'), ...range) : query(collectionGroup(db, col), ...range));
  const rows = snap.docs.map(toRow);
  recsCache.set(key, rows);
  return rows;
}

  return customers.get(r.customerId) || { id: r.customerId, name: r.customerName || '（無權限檢視的客戶）', status: 'formal', formalNo: r.customerNo || '', region: r.region || '', salesEmail: r.salesEmail || '' };

const REC_LABEL = { demos: 'Demo 紀錄', purchases: '採購紀錄', issues: '問題追蹤', installs: '工程師安裝紀錄' };

async function runRecordsImport(data) {
  if (!confirm(`確定匯入 ${data.records.length} 筆紀錄？\n\n同一個檔案重複匯入，會覆蓋之前匯入的同一筆紀錄。`)) return;
  const btn = $('#impGo'), msg = $('#impMsg');
  btn.disabled = true;
  try {
    const map = await ensurePeople(data.people || []);
    const who = n => (n ? map[normName(n)] : '') || '';
    const U = data.unlinked;
    await setDoc(doc(db, 'customers', U.id), { status: 'potential', leadNo: '', formalNo: '', region: '', name: U.name, salesEmail: '', deleted: false, needsCheck: false, source: 'notion', createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() }, { merge: true });
    if (!customers.has(U.id)) customers.set(U.id, { id: U.id, name: U.name, status: 'potential', region: '' });
    const recs = data.records;
    for (let i = 0; i < recs.length; i += 200) {
      const batch = writeBatch(db);
      for (const r of recs.slice(i, i + 200)) {
        const c = customers.get(r.customerId) || {};
        const { salesName, engineerName, ...rest } = r.data;
        const base = { ...rest, createdBy: who(r.creator) || me.email, importedCreator: r.creator || '', source: 'notion', createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() };
        if (r.col === 'demos') {
          batch.set(doc(db, 'demos', r.id), { ...base, salesEmail: who(salesName) || (rest.type === 'sales' ? (c.salesEmail || '') : ''), engineerEmail: who(engineerName),
            customerId: r.customerId, customerName: c.name || '', customerNo: custNo(c), region: c.region || '' });
        } else {
          batch.set(doc(db, 'customers', r.customerId, r.col, r.id), base);
        }
      }
      await batch.commit();
      msg.textContent = `已匯入 ${Math.min(i + 200, recs.length)} / ${recs.length} 筆…`;
    }
    recCache.clear(); recsCache.clear();
    await syncCustomers(true);
    msg.textContent = '';
    alert(`紀錄匯入完成：${recs.length} 筆。`);
    location.hash = '#/records';
  } catch (err) { toast('匯入失敗：' + errMsg(err), 10000); btn.disabled = false; }
}

async function runImport(data, salesRows) {
  if (!confirm(`確定匯入 ${data.records.length} 筆客戶？\n\n同一個檔案重複匯入，會用檔案內容覆蓋之前匯入的同一筆資料。`)) return;
  const btn = $('#impGo'), msg = $('#impMsg');
  btn.disabled = true;
  try {
    // 1. 業務對應，找不到的建立離職人員
    const map = {};
    for (const s of salesRows) {
      if (s.user) { map[s.nameEn] = s.user.email; continue; }
      const email = slugEmail(s.nameEn);
      await setDoc(doc(db, 'users', email), { email, nameZh: s.nameZh || s.nameEn, nameEn: s.nameEn, role: 'sales', regions: [], region: '', alsoEngineer: false, active: false, placeholder: true, updatedBy: me.email, updatedAt: serverTimestamp() }, { merge: true });
      map[s.nameEn] = email;
    }
    // 2. 客戶，每批 200 筆
    const recs = data.records;
    for (let i = 0; i < recs.length; i += 200) {
      const batch = writeBatch(db);
      for (const r of recs.slice(i, i + 200)) {
        const { id, salesName, ...rest } = r;
        batch.set(doc(db, 'customers', id), {
          ...rest, salesEmail: map[salesName] || '', importedSales: salesName || '', source: 'notion', deleted: false,
          createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp()
        });
      }
      await batch.commit();
      msg.textContent = `已匯入 ${Math.min(i + 200, recs.length)} / ${recs.length} 筆…`;
    }
    // 3. 編號：只往上調，不往回
    for (const [k, v] of Object.entries(data.counters || {})) {
      const s = await getDoc(doc(db, 'counters', k));
      const cur = s.exists() ? s.data().next : 1;
      if (v > cur) await setDoc(doc(db, 'counters', k), { next: v });
    }
    await syncCustomers(true);
    msg.textContent = '';
    alert(`匯入完成：${recs.length} 筆客戶。`);
    location.hash = '#/customers';
  } catch (err) { toast('匯入失敗：' + errMsg(err), 10000); btn.disabled = false; }
}

// 更換 Google 帳號：把所有指向舊帳號的欄位改成新帳號
async function moveUserRefs(oldE, newE) {
  const FIELDS = ['salesEmail', 'engineerEmail', 'createdBy'];
  const jobs = [];
  const scan = d => {
    const x = d.data(), upd = {};
    FIELDS.forEach(f => { if (x[f] === oldE) upd[f] = newE; });
    if (Object.keys(upd).length) jobs.push([d.ref, { ...upd, updatedBy: me.email, updatedAt: serverTimestamp() }]);
  };
  const sources = [collection(db, 'customers'), collection(db, 'demos'), collection(db, 'schedules'), collectionGroup(db, 'purchases'), collectionGroup(db, 'issues'), collectionGroup(db, 'installs')];
  for (const src of sources) (await getDocs(src)).docs.forEach(scan);
  for (let i = 0; i < jobs.length; i += 200) {
    const b = writeBatch(db);
    jobs.slice(i, i + 200).forEach(([ref, upd]) => b.update(ref, upd));
    await b.commit();
  }
  return jobs.length;
}

      };
      if (changed) {
        dlg.querySelector('#save').textContent = '更新中…';
        await setDoc(doc(db, 'users', email), { ...cur, ...data, placeholder: false });
        const n = await moveUserRefs(oldEmail, email);
        await deleteDoc(doc(db, 'users', oldEmail));
        close();
        alert(`已改成新帳號，共更新 ${n} 筆資料。\n請通知 ${nameZh} 改用 ${email} 登入。`);
        return;
      }
      await setDoc(doc(db, 'users', email), data, { merge: true });
      close();
      const n = form.active.value === '0' ? [...customers.values()].filter(c => !c.deleted && c.salesEmail === email).length : 0;
      if (n) { alert(`${nameZh} 已設為離職。\n\n他目前負責 ${n} 位客戶，請到「客戶」頁點「查看名單」調整負責業務。`); }
      else toast('已儲存');
    } catch (err) { toast(errMsg(err)); dlg.querySelector('#save').disabled = false; }
  });
  dlg.showModal();
}

// ---------------- 編號設定（管理者）----------------
async function viewSettings() {
  app.innerHTML = '<div class="card"><h1>編號設定</h1><p class="muted">載入中…</p></div>';
  const vals = {};
  try {
    for (const [k] of COUNTERS) { const s = await getDoc(doc(db, 'counters', k)); vals[k] = s.exists() ? s.data().next : 1; }
  } catch (e) { toast(errMsg(e)); return; }
  app.innerHTML = `<div class="card"><h1>編號設定</h1>
    <p class="muted">設定每一類「下一個要使用的號碼」。例：台北潛在客戶最後一筆是 L-A00354，這裡就填 355。</p>
    <form id="sf"><div class="grid">${COUNTERS.map(([k, t, p]) => `<div class="field"><label>${t}（${p}）下一號</label><input type="number" min="1" name="${k}" value="${vals[k]}"><div class="muted" data-p="${k}">下一筆：${fmt(p, vals[k])}</div></div>`).join('')}</div>
    <div class="row-actions" style="margin-top:20px"><button type="submit">儲存</button></div></form></div>`;
  const form = $('#sf');
  form.addEventListener('input', e => {
    const k = e.target.name; const p = COUNTERS.find(c => c[0] === k)?.[2];
    if (p) form.querySelector(`[data-p="${k}"]`).textContent = '下一筆：' + fmt(p, Math.max(1, parseInt(e.target.value) || 1));
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!confirm('確定更新編號？設定錯誤可能產生重複編號。')) return;
    try {
      for (const [k] of COUNTERS) await setDoc(doc(db, 'counters', k), { next: Math.max(1, parseInt(form[k].value) || 1) });
      toast('已儲存');
    } catch (err) { toast(errMsg(err)); }
  });
}
